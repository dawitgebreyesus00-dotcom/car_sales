name: car_sales_app
description: "Ethiopian Car Sales Marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  lucide_icons_flutter: ^4.0.0
  simple_icons: ^16.23.0
  material_symbols_icons: ^4.2668.0

  # Fonts & Typography
  google_fonts: ^6.2.1

  # Utils
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Launcher icon configuration
# This will generate proper app icons for Android & iOS
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/car_sales app logo.jpg"
  min_android_api: 21
  # adaptive_icon_background: "#1B5E20"
  # adaptive_icon_foreground: "assets/images/car_sales app logo.jpg"